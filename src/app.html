<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The ?v=2 busts browsers' separate favicon caches (the rebrand left the
         old crimson icon stuck in Firefox); bump it when the favicon changes. -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The no-flash theme read. Runs synchronously before the first paint, so a returning
      // visitor's explicit choice (Nav.svelte's toggle) never flashes the system default first.
      // No cookie leaves data-theme unset, and app.css's own prefers-color-scheme block (the
      // ecxc-dark theme's prefersdark setting) picks the system scheme with no JS involved at all.
      (function () {
        var match = document.cookie.match(/(?:^|; )cairn-site-theme=(ecxc-dark|ecxc)(?:;|$)/);
        if (match) document.documentElement.setAttribute('data-theme', match[1]);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
