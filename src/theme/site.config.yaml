siteName: ECXC
description: "East Community Cross Country: year-round training for high school skiers and runners in Anchorage, Alaska."
author: ECXC
locale: en-US

# Tidy, the editor's reviewed AI copy-edit (defaults: claude-sonnet-4-6, objective fixes on,
# style tier off). Needs ANTHROPIC_API_KEY on the worker; sync.sh routes it.
tidy:
  enabled: true

# The curated tag vocabulary ({value,label}): value is the frozen frontmatter token every
# post carries (formerly settings.postTags, the fixed options list on the tags field), label
# is the editable display name the admin and any tag-filter UI show.
vocabulary:
  - value: training
    label: Training
  - value: racing
    label: Racing
  - value: results
    label: Results
  - value: events
    label: Events
  - value: camp
    label: Camp
  - value: announcements
    label: Announcements

menus:
  primary:
    - { label: About, url: /about }
    - { label: Training, url: /training }
    - { label: Talkeetna Camp, url: /talkeetna }
    - { label: Volunteers & Coaches, url: /volunteers }
    - { label: CrewLAB, url: /crewlab }
    - { label: Contact, url: /contact }
