name = "ecxc"
# Lets cairn-doctor derive the account for its D1 auth-store check.
account_id = "120c269ad6d3dfbe6d63a0bb53758ca0"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

main = ".svelte-kit/cloudflare/_worker.js"

# not_found_handling = "none" (the schema's own default, set here explicitly) passes an unmatched
# request through to the Worker instead of serving a static 404 straight from the edge, so
# SvelteKit's built-in default-404 handling renders the themed root src/routes/+error.svelte
# through a real SSR response. See ../cairn-cms/examples/showcase/src/chassis/README.md's "The
# themed-404 pattern".
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
not_found_handling = "none"

# The contact form's destination (wired in a later task). destination_address stays the current
# ecxc.ski domain, not the pre-rename ecnordic.ski address main still carried.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "contact@ecxc.ski"

# cairn-cms: unrestricted Email Sending binding for magic links (arbitrary recipients).
# remote = true so `wrangler dev` sends real mail.
[[send_email]]
name = "EMAIL"
remote = true

# cairn-cms: self-owned magic-link auth store (editor allowlist, magic_token, session tables).
[[d1_databases]]
binding = "AUTH_DB"
database_name = "cairn-ecxc-auth"
database_id = "a47c56d2-25ef-4131-a505-8c9fd5a92f1f"

# cairn-cms 0.57+: R2 bucket backing the media library. The /media delivery route streams
# content-addressed image bytes from here; the adapter's assets block names this binding.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ecxc-media"

# cairn-cms 0.36+: ship cairn's structured log events to Workers Logs.
[observability]
enabled = true

[vars]
# Site origin, used to build magic links. Dev overrides via PUBLIC_ORIGIN in .dev.vars.
PUBLIC_ORIGIN = "https://ecxc.ski"
# The registration roster spreadsheet (Geoff's, shared to the ecxc-sheets service account
# whose key is the GOOGLE_SA_KEY_B64 secret). Tabs: "Training" and "Talkeetna Camp".
REGISTRATION_SHEET_ID = "1WUpt5DpYdnOw1umPJeDRnbqWVWW5_55Mqf2H_yHomKM"

[[routes]]
pattern = "ecxc.ski"
custom_domain = true
